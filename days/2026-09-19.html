const P=[
["Reading A · Why AI Infrastructure Becomes a Local Question","A city may welcome AI investment, yet a {municipality} must decide whether existing {zoning} rules fit facilities that consume industrial-scale power. A new {ordinance} can set conditions, while a temporary {moratorium} may pause approvals. The debate sits at the [boundary] between national technology ambitions and local land-use authority.","为什么AI数据中心首先会变成地方治理问题？","国家AI投资需求 → 地方掌握土地规则 → 需要新条例或暂缓审批。","municipality 与 zoning 可由 city、land-use authority 推断；moratorium 与 pause approvals 同义。","城市可能欢迎人工智能投资，但市政当局必须判断现有分区规划规则是否适合耗电达到工业规模的设施。新条例可以设定条件，而临时暂停令可以暂停审批。这场争论处在国家技术雄心与地方土地使用权之间的边界上。"],
["","Electricity costs make the issue concrete. A {ratepayer} may fear a new {surcharge} if utilities must build a {substation} for hundreds of {megawatt} of new demand. Even when developers supply private [capital], grid upgrades can create a public [bottleneck] if costs and benefits are not allocated clearly.","为什么电网成本分配会引发居民担忧？","大负荷接入 → 电网扩建 → 成本可能转嫁 → 公私收益不对称。","ratepayer 紧邻 electricity costs；surcharge 与 new cost 对应；substation 属于 grid upgrades。","电力成本让问题变得具体。如果公用事业公司必须为数百兆瓦的新需求建设变电站，缴纳电费的用户可能担心新增附加费。即使开发商提供私人资本，如果成本和收益分配不清，电网升级仍可能形成公共瓶颈。"],
["","Supply is not only about wires. A gas {turbine} can provide firm power, {geothermal} plants can offer low-carbon generation, and backup {combustion} equipment can operate during emergencies. Each option changes the emissions profile and the [infrastructure] needed around a data-center campus.","为什么数据中心能源选择不只是多接几根电线？","不同电源 → 稳定性与排放不同 → 配套基础设施不同。","turbine、geothermal、combustion 都由 power/generation/emissions 语境限定。","供能不只是电线问题。燃气涡轮机可以提供稳定电力，地热电站可以提供低碳发电，备用燃烧设备可在紧急情况下运行。每种选择都会改变排放特征以及数据中心园区周边所需的基础设施。"],
["","Water creates a second resource question. Where cooling draws on {groundwater} or {potable} supplies, residents may ask whether computing should compete with households. Systems that reuse {wastewater} through {reclamation} can reduce pressure, but {evaporation} still matters in hot, dry periods.","冷却系统为什么会把AI问题变成水资源问题？","冷却耗水 → 与居民需求竞争 → 回用可减压但不能消除蒸发损耗。","potable 与 households 暗示可饮用水；reclamation 由 reuse wastewater 直接定义。","水资源带来第二个问题。如果冷却系统使用地下水或饮用水，居民可能质疑计算设施是否应该与家庭争夺水源。通过回收处理废水的系统可以减轻压力，但在炎热干旱时期，蒸发损耗仍然重要。"],
["","Environmental effects are also {localized}. A facility's {thermal} discharge may affect a nearby {habitat}, while construction can transform land. Building on a {brownfield} may reuse disturbed property; a {greenfield} project can require more new roads and utilities. That difference shapes public [sentiment].","为什么同样规模的数据中心在不同地点影响会不同？","选址环境不同 → 土地与生态影响不同 → 公众态度不同。","brownfield 与 reuse disturbed property 对应；greenfield 与 more new roads 对比。","环境影响也具有明显的局部性。设施的热排放可能影响附近栖息地，施工也会改变土地。在棕地上建设可以重复利用已受扰动地块；绿地项目则可能需要更多新道路和公用设施。这种差异会影响公众态度。"],
["","That is why {siting} is often slower than a technology company's product cycle. Projects can wait in a permitting {queue}, negotiate an {easement} for power lines, assemble each land {parcel}, or request {rezoning}. Physical AI therefore faces a different [constraint] from software: servers can scale quickly, but places cannot be copied instantly.","为什么实体AI基础设施扩张速度常慢于软件？","软件可快速复制 → 土地、电网、许可不可复制 → 选址排队形成约束。","queue 与 wait 同义；easement 与 power lines 搭配；parcel 与 land 搭配。","因此，选址往往比科技公司的产品周期慢。项目可能在许可队列中等待，为电力线路协商地役权，整合每一块土地，或申请重新分区。实体AI面临与软件不同的约束：服务器可以快速扩展，但地点无法瞬间复制。"],
["","Public acceptance depends on process as much as engineering. Every {stakeholder} sees a different risk: neighbors may organize {opposition} over noise, and constant equipment hum can become a {nuisance}. Emergency {diesel} units and each backup {generator} can intensify concern even if they run rarely.","为什么工程达标仍不等于社区接受？","技术合规 ≠ 居民体验 → 噪声和备用设备引发反对。","stakeholder 后面列出 neighbors；nuisance 由 constant hum 推断。","公众接受程度不仅取决于工程，也取决于过程。每个利益相关者看到的风险不同：邻居可能因噪声组织反对，持续的设备嗡鸣也可能成为滋扰。即使很少运行，应急柴油设备和每台备用发电机仍可能加剧担忧。"],
["Reading B · Who Pays, Who Benefits, and What Rules Can Do","The hardest arguments are therefore {contentious} distributional ones. An {equitable} policy asks whether benefits and burdens fall on the same groups. A city may gain jobs and taxes while a neighborhood bears {localized} noise or grid construction. Good [oversight] makes those trade-offs visible rather than pretending every effect is shared equally.","谁受益、谁承担成本为什么是核心争议？","收益与负担空间错位 → 公平问题 → 监督需揭示分配结果。","equitable 由 benefits and burdens 是否落在同一群体上解释。","最难的争论因此往往是有争议的分配问题。公平政策会追问收益和负担是否落在同一群体上。一座城市可能获得就业和税收，而某个社区承担局部噪声或电网施工。良好的监督应让这些权衡可见。"],
["","Some benefits are {ancillary} rather than direct. A {prospective} project might finance roads, fiber, or workforce training, but promises should face [scrutiny]. Officials need evidence that side benefits will actually arrive and that public spending is not justified only by optimistic [visibility] around AI.","为什么不能只看开发商承诺的附带收益？","项目承诺 → 可能带来配套收益 → 需要证据审查 → 防止被AI热度放大。","ancillary 后面列出 roads/fiber/training；prospective 表示尚未落地。","一些收益是辅助性的而非直接收益。潜在项目可能资助道路、光纤或劳动力培训，但这些承诺应接受审查。官员需要证据证明附带收益确实会出现，而公共支出不能仅由人工智能带来的乐观曝光来证明合理。"],
["","Legitimacy also depends on {procedural} fairness. Early {consultation} can reveal a community {grievance} before it hardens into resistance. A developer may then offer a {concession}, such as quieter equipment or restricted construction hours. This can improve the local [ecosystem] without eliminating disagreement.","为什么早期协商可能比事后补救更有效？","早期发现不满 → 调整方案 → 降低冲突升级。","grievance 与 resistance 相关；concession 后面的 quieter equipment 是具体让步例子。","合法性还取决于程序公平。早期协商可以在社区不满固化为抵制之前发现问题。开发商随后可能作出让步，例如使用更安静的设备或限制施工时间。这可以改善当地生态，但并不能消除所有分歧。"],
["","Information rules matter too. A {nondisclosure} agreement may protect commercial details, yet excessive {secrecy} can prevent residents from estimating future power or water demand. A more [transparent] process can publish aggregate figures while protecting genuinely sensitive data, reducing suspicion without exposing every contract.","商业保密和公共透明如何兼容？","必要保密 → 过度秘密削弱信任 → 发布汇总数据实现平衡。","nondisclosure 与 protect commercial details 对应；secrecy 与 prevent residents from estimating 对应。","信息规则同样重要。不披露协议可以保护商业细节，但过度保密会阻止居民估算未来的电力或用水需求。更透明的流程可以公布汇总数据，同时保护真正敏感的信息。"],
["","Fiscal design determines whether growth strengthens local services. A {municipal} government can impose a {levy}, grant an {exemption}, or offer a {rebate}. Each choice changes the {distributive} outcome: a larger {tax-base} is useful only if the resulting revenue is commensurate with new public costs.","税收优惠为什么不能只看吸引投资？","税费工具 → 改变项目净收益 → 必须与新增公共成本比较。","levy/exemption/rebate 构成征收、豁免、返还的对照；tax-base 与 revenue 直接关联。","财政设计决定增长是否能加强地方公共服务。市政府可以征收税费、给予豁免或提供返还。每种选择都会改变分配结果：扩大税基只有在由此产生的收入与新增公共成本相称时才真正有用。"],
["","Residents also care about the {property-tax} effect and neighborhood {amenity}. If new facilities raise land values but add traffic or noise, gains are uneven. Policy can {curtail} the worst effects through setbacks, sound limits, and monitoring, while targeted [mitigation] can address harms that cannot be designed away.","为什么房价或税基上涨不能代表所有居民都受益？","资产价值变化 + 生活环境变化 → 收益不均 → 规则和缓解措施补偿外部影响。","amenity 由 traffic/noise 的生活环境语境推断；curtail 后面列出限制手段。","居民也关心房产税影响和社区宜居条件。如果新设施提高土地价值却增加交通或噪声，收益就并不均匀。政策可以通过退距、噪声限制和监测来削减最严重影响，并用针对性的缓解措施处理无法通过设计消除的损害。"],
["","The long-run test is whether AI infrastructure becomes a durable bargain rather than a race for capacity. Faster [architecture], lower [latency] and greater [bandwidth] can improve digital services, while creator-style [monetization] and corporate demand keep compute valuable. But if local [inequality] and resource [imbalance] deepen, political resistance can slow the next project. Sustainable expansion therefore requires engineering, finance and public consent to move together.","AI基础设施长期扩张的真正约束是什么？","算力价值上升 → 继续扩建 → 若地方成本失衡则政治阻力上升 → 技术、金融、公众同向才可持续。","最后一句 therefore 汇总全文；durable bargain 与 race for capacity 构成长期治理对比。","长期检验在于AI基础设施能否形成持久的社会契约，而不是单纯追逐容量。更快的架构、更低延迟和更高带宽可以改善数字服务，变现和企业需求也会维持算力价值。但如果地方不平等和资源失衡加深，政治阻力可能拖慢下一个项目。"]];
window.KAOYAN_TRANSLATIONS=P.map(x=>x[5]);function mark(s){return s.replace(/\{([^}]+)\}/g,(m,w)=>`<span class="word" data-word="${w}" data-meaning="${KAOYAN_NEW[w]}">${w}</span>`).replace(/\[([^\]]+)\]/g,(m,w)=>`<span class="word" data-word="${w}" data-type="review" data-meaning="${KAOYAN_REVIEW[w]}">${w}</span>`)}let a=document.getElementById('article');P.forEach((x,i)=>{if(x[0])a.insertAdjacentHTML('beforeend',`<div class="part"><b>${x[0]}</b></div>`);let words=[...x[1].matchAll(/[\{\[]([^}\]]+)[\}\]]/g)].map(m=>m[1]);a.insertAdjacentHTML('beforeend',`<p id="para-${i+1}">${mark(x[1])}</p><details class="note"><summary>🟣 表达拆解 ${i+1}</summary><p>${x[4]}</p></details><details class="recall"><summary>🧠 段落回忆 ${i+1}</summary><p>${x[2]}</p><button onclick="this.nextElementSibling.hidden=false">提示1 · 逻辑链</button><span hidden>${x[3]}</span><br><button onclick="this.nextElementSibling.hidden=false">提示2 · 猜词线索</button><span hidden>${x[4]}</span><br><button onclick="this.nextElementSibling.hidden=false">显示答案</button><div class="ans" hidden>${words.map(w=>w+'：'+(KAOYAN_NEW[w]||KAOYAN_REVIEW[w])).join('；')}</div></details>`)});function card(w,d){return `<div class="vcard" id="card-${w}"><button class="wordlink" onclick="window.traceWordToArticle&&traceWordToArticle('${w}',this)">${w}</button><div>${d[w]}</div><div>${KAOYAN_IPA[w]} <button onclick="window.speakWord?speakWord('${w}'):(speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance('${w}'),{lang:'en-US'})))">🔊</button></div></div>`}newGrid.innerHTML=Object.keys(KAOYAN_NEW).map(w=>card(w,KAOYAN_NEW)).join('');reviewGrid.innerHTML=Object.keys(KAOYAN_REVIEW).map(w=>card(w,KAOYAN_REVIEW)).join('');
</script><script src="../app.js?v=20260922-history-all-1"></script><script src="../sync.js?v=20260922-history-all-1"></script><script src="../review-origin.js?v=20260919-1"></script></body></html>
