name: Direct review origin fix
on:
  push:
    paths:
      - '.github/workflows/direct-review-origin-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files safely
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json,re
          app=Path('app.js'); s=app.read_text()
          start=s.find('function enhanceVocabList(details,map)')
          end=s.find('updateProgressSummary();',start)
          if start<0: raise SystemExit('enhanceVocabList old block not found')
          # only replace through the two enhance calls, not later code
          calls=s.find("enhanceVocabList(detailEls.find(d=>/今日复习词/",start)
          semi=s.find(';',calls)+1
          if calls<0 or semi<=0: raise SystemExit('review enhance call not found')
          new=r'''function enhanceVocabList(details,map,options={}){if(!details||!map||!Object.keys(map).length)return;const old=details.querySelector('p');if(!old)return;const wrap=document.createElement('div');wrap.className='vocab-list';const origins=options.origins||{};Object.entries(map).forEach(([word,zh])=>{const key=word.toLowerCase();const row=document.createElement('div');row.className='vocab-item';const head=document.createElement('span');head.className='vocab-head';const w=document.createElement('button');w.type='button';w.className='vocab-source-link';w.textContent=word;w.title='定位今天正文';w.addEventListener('click',ev=>{ev.preventDefault();traceWordToArticle(key,w);});head.append(w,document.createTextNode(' '),makePhonetic(key,word));const meaning=document.createElement('span');meaning.className='vocab-meaning';meaning.textContent=' '+zh;row.append(head,meaning);if(options.review){const actions=document.createElement('div');actions.className='vocab-origin-actions';const here=document.createElement('button');here.type='button';here.className='btn';here.textContent='🔎 本文语境';here.addEventListener('click',()=>traceWordToArticle(key,here));actions.append(here);const first=origins[key];if(first){const a=document.createElement('a');a.className='btn';a.textContent='📖 首学 '+first.slice(5);a.href='./'+first+'.html?word='+encodeURIComponent(key);actions.append(a);}row.append(actions);}wrap.append(row);});old.replaceWith(wrap);}
function traceRequestedWord(){const word=(new URLSearchParams(location.search).get('word')||'').toLowerCase();if(!word)return;setTimeout(()=>{const target=[...document.querySelectorAll('.article .word')].find(el=>el.dataset.word===word);if(!target)return;target.scrollIntoView({behavior:'smooth',block:'center'});target.style.outline='3px solid currentColor';target.style.outlineOffset='4px';setTimeout(()=>{target.style.outline='';target.style.outlineOffset='';},2600);},120);}
const detailEls=[...document.querySelectorAll('details')];enhanceVocabList(detailEls.find(d=>/今日\s*50\s*个新词|今日新词/.test(d.querySelector('summary')?.textContent||'')),window.KAOYAN_NEW||{});enhanceVocabList(detailEls.find(d=>/今日复习词/.test(d.querySelector('summary')?.textContent||'')),window.KAOYAN_REVIEW||{},{review:true,origins:window.KAOYAN_REVIEW_ORIGIN||{}});traceRequestedWord();'''
          s=s[:start]+new+s[semi:]
          app.write_text(s)

          p=Path('days/2026-09-16.html'); h=p.read_text()
          origins={'imbalance':'2026-09-15','divergence':'2026-09-15','sluggish':'2026-09-15','overcapacity':'2026-09-15','bottleneck':'2026-09-15','convergence':'2026-09-15','deleverage':'2026-09-15','inequality':'2026-09-15','thrift':'2026-09-15','sentiment':'2026-09-15','appreciation':'2026-09-14','arbitrage':'2026-09-14','discretion':'2026-09-14','exacerbate':'2026-09-14','sophistication':'2026-09-14','infringement':'2026-09-13','deterrence':'2026-09-13','litigation':'2026-09-13','enforceable':'2026-09-13','authenticity':'2026-09-11'}
          if 'window.KAOYAN_REVIEW_ORIGIN=' not in h:
              h=h.replace('window.KAOYAN_REVIEW={','window.KAOYAN_REVIEW_ORIGIN='+json.dumps(origins,separators=(',',':'))+';window.KAOYAN_REVIEW={',1)
          h=re.sub(r'\.\./app\.js\?v=[^"\']+','../app.js?v=20260917-origin-fix2',h)
          p.write_text(h)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js days/2026-09-16.html
          git commit -m "Fix Sep 16 review origin tracing" || exit 0
          git push
