name: Add review origin links
on:
  push:
    paths:
      - '.github/workflows/add-review-origin.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade app, Sep 16 metadata, README and cache
        shell: python
        run: |
          from pathlib import Path
          import re

          app=Path('app.js')
          s=app.read_text()
          old="function enhanceVocabList(details,map){if(!details||!map||!Object.keys(map).length)return;const old=details.querySelector('p');if(!old)return;const wrap=document.createElement('div');wrap.className='vocab-list';Object.entries(map).forEach(([word,zh])=>{const key=word.toLowerCase();const row=document.createElement('div');row.className='vocab-item';const head=document.createElement('span');head.className='vocab-head';const w=document.createElement('button');w.type='button';w.className='vocab-source-link';w.textContent=word;w.title='点击回到正文中第一次出现的位置';w.setAttribute('aria-label',`在正文中定位 ${word}`);w.style.border='0';w.style.padding='0';w.style.margin='0';w.style.background='transparent';w.style.font='inherit';w.style.fontWeight='700';w.style.color='inherit';w.style.textDecoration='underline';w.style.textDecorationStyle='dotted';w.style.textUnderlineOffset='3px';w.style.cursor='pointer';w.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();traceWordToArticle(key,w);});head.append(w,document.createTextNode(' '),makePhonetic(key,word));const meaning=document.createElement('span');meaning.className='vocab-meaning';meaning.textContent=' '+zh;row.append(head,meaning);wrap.append(row);});old.replaceWith(wrap);}\nconst detailEls=[...document.querySelectorAll('details')];enhanceVocabList(detailEls.find(d=>/今日\\s*50\\s*个新词|今日新词/.test(d.querySelector('summary')?.textContent||'')),window.KAOYAN_NEW||{});enhanceVocabList(detailEls.find(d=>/今日复习词/.test(d.querySelector('summary')?.textContent||'')),window.KAOYAN_REVIEW||{});"
          new="""function enhanceVocabList(details,map,options={}){if(!details||!map||!Object.keys(map).length)return;const old=details.querySelector('p');if(!old)return;const wrap=document.createElement('div');wrap.className='vocab-list';const origins=options.origins||{};Object.entries(map).forEach(([word,zh])=>{const key=word.toLowerCase();const row=document.createElement('div');row.className='vocab-item';const head=document.createElement('span');head.className='vocab-head';const w=document.createElement('button');w.type='button';w.className='vocab-source-link';w.textContent=word;w.title='点击定位到今天正文中第一次出现的位置';w.setAttribute('aria-label',`在今天正文中定位 ${word}`);w.style.border='0';w.style.padding='0';w.style.margin='0';w.style.background='transparent';w.style.font='inherit';w.style.fontWeight='700';w.style.color='inherit';w.style.textDecoration='underline';w.style.textDecorationStyle='dotted';w.style.textUnderlineOffset='3px';w.style.cursor='pointer';w.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();traceWordToArticle(key,w);});head.append(w,document.createTextNode(' '),makePhonetic(key,word));const meaning=document.createElement('span');meaning.className='vocab-meaning';meaning.textContent=' '+zh;row.append(head,meaning);if(options.review){const actions=document.createElement('div');actions.className='vocab-origin-actions';actions.style.marginTop='6px';actions.style.display='flex';actions.style.gap='8px';actions.style.flexWrap='wrap';const here=document.createElement('button');here.type='button';here.className='btn vocab-context-link';here.textContent='🔎 本文语境';here.addEventListener('click',()=>traceWordToArticle(key,here));actions.append(here);const first=origins[key];if(first){const a=document.createElement('a');a.className='btn vocab-origin-link';a.textContent=`📖 首学 ${first.slice(5)}`;a.href=`./${first}.html?word=${encodeURIComponent(key)}&origin=review`;actions.append(a);}row.append(actions);}wrap.append(row);});old.replaceWith(wrap);}
function traceRequestedWord(){const params=new URLSearchParams(location.search),word=(params.get('word')||'').toLowerCase();if(!word)return;let tries=0;const go=()=>{const target=[...document.querySelectorAll('.article .word')].find(el=>el.dataset.word===word);if(target){try{target.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){target.scrollIntoView();}target.style.outline='3px solid currentColor';target.style.outlineOffset='4px';target.style.boxShadow='0 0 0 8px rgba(255,215,0,.28)';setTimeout(()=>{target.style.outline='';target.style.outlineOffset='';target.style.boxShadow='';},2600);return;}if(++tries<12)setTimeout(go,80);};setTimeout(go,80);}
const detailEls=[...document.querySelectorAll('details')];enhanceVocabList(detailEls.find(d=>/今日\\s*50\\s*个新词|今日新词/.test(d.querySelector('summary')?.textContent||'')),window.KAOYAN_NEW||{});enhanceVocabList(detailEls.find(d=>/今日复习词/.test(d.querySelector('summary')?.textContent||'')),window.KAOYAN_REVIEW||{},{review:true,origins:window.KAOYAN_REVIEW_ORIGIN||{}});traceRequestedWord();"""
          if old not in s:
              raise SystemExit('Expected enhanceVocabList block not found; aborting safely')
          app.write_text(s.replace(old,new))

          p=Path('days/2026-09-16.html');h=p.read_text();marker='window.KAOYAN_REVIEW={'
          origins={'imbalance':'2026-09-15','divergence':'2026-09-15','sluggish':'2026-09-15','overcapacity':'2026-09-15','bottleneck':'2026-09-15','convergence':'2026-09-15','deleverage':'2026-09-15','inequality':'2026-09-15','thrift':'2026-09-15','sentiment':'2026-09-15','appreciation':'2026-09-14','arbitrage':'2026-09-14','discretion':'2026-09-14','exacerbate':'2026-09-14','sophistication':'2026-09-14','infringement':'2026-09-13','deterrence':'2026-09-13','litigation':'2026-09-13','enforceable':'2026-09-13','authenticity':'2026-09-11'}
          import json
          if 'window.KAOYAN_REVIEW_ORIGIN=' not in h:h=h.replace(marker,'window.KAOYAN_REVIEW_ORIGIN='+json.dumps(origins,separators=(',',':'))+';'+marker,1)
          h=re.sub(r'\.\./app\.js\?v=[^\"\']+', '../app.js?v=20260917-review-origin-2', h);p.write_text(h)

          r=Path('README.md');t=r.read_text()
          if 'KAOYAN_REVIEW_ORIGIN' not in t:
            needle='- 新词列表和复习词列表都必须支持该功能。\n'
            t=t.replace(needle,needle+'- 复习词卡必须同时提供 **🔎 本文语境** 与 **📖 首学 MM-DD**；前者定位当天复现位置，后者进入首次学习文章并自动定位。\n- 每日复习页面必须定义 `window.KAOYAN_REVIEW_ORIGIN`，来源日期必须由历史记录核实。\n- 首学文章必须支持 `?word=<word>&origin=review` 深链接自动定位。\n')
            r.write_text(t)
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js days/2026-09-16.html README.md
          git commit -m "Fix review word origin tracing" || exit 0
          git push
# retrigger 2026-09-17
