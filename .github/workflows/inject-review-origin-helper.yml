name: Deploy review tracing helper
on:
  push:
    paths:
      - '.github/workflows/inject-review-origin-helper.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add helper to review and origin pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for d in ['2026-09-11','2026-09-13','2026-09-14','2026-09-15','2026-09-16']:
              p=Path('days')/(d+'.html')
              s=p.read_text()
              if d=='2026-09-16':
                  s=re.sub(r'\.\./review-origin\.js\?v=[^"\']+','../review-origin.js?v=20260917-2',s)
              elif 'review-origin.js' not in s:
                  s=s.replace('</body>','<script src="../review-origin.js?v=20260917-2"></script></body>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add days/2026-09-11.html days/2026-09-13.html days/2026-09-14.html days/2026-09-15.html days/2026-09-16.html
          git commit -m "Deploy complete review origin tracing" || exit 0
          git push
