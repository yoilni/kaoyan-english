name: Sync vocab log
on:
  push:
    branches: [main]
    paths: ['days/*.html', 'data/vocab-log-*.json', 'scripts/vocab.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generated-content-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/vocab.py --sync
      - name: Commit complete vocabulary history
        run: |
          if git diff --quiet -- data/vocab-log.json data/word-origins.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocab-log.json data/word-origins.json
          git commit -m 'Sync complete vocabulary history and first-learning dates'
          git push
