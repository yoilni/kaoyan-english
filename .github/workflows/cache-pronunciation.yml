name: Cache pronunciation URLs

on:
  push:
    branches: [main]
    paths:
      - 'days/*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve audio and sync vocabulary log
        shell: python
        run: |
          import json, re, time, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import date

          files = sorted(Path('days').glob('*.html'))
          if not files:
              raise SystemExit('No daily pages found')
          page = files[-1]
          text = page.read_text(encoding='utf-8')
          day = page.stem

          def read_obj(name):
              m = re.search(rf'window\.{name}=({{.*?}});', text, re.S)
              return json.loads(m.group(1)) if m else {}

          new_map = read_obj('KAOYAN_NEW')
          review_map = read_obj('KAOYAN_REVIEW')
          words = []
          for src in (new_map, review_map):
              for word in src:
                  key = word.lower()
                  if key not in words:
                      words.append(key)

          log_path = Path('data/vocab-log.json')
          log = json.loads(log_path.read_text(encoding='utf-8'))
          days = log.setdefault('days', {})
          review_stages = {}
          today = date.fromisoformat(day)
          for word in review_map:
              for old_day, info in reversed(list(days.items())):
                  if word in (info.get('new') or []):
                      delta = (today - date.fromisoformat(old_day)).days
                      if delta in log.get('schedule_days', [1,2,4,7,15,30]):
                          review_stages[word] = delta
                      break
          days[day] = {'new': list(new_map.keys()), 'review': review_stages}
          log_path.write_text(json.dumps(log, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Synced {day}: {len(new_map)} new, {len(review_stages)} scheduled reviews')

          def lookup(word):
              url = 'https://api.dictionaryapi.dev/api/v2/entries/en/' + urllib.parse.quote(word)
              req = urllib.request.Request(url, headers={'User-Agent':'kaoyan-english-pronunciation-cache/1.1'})
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      data = json.load(r)
              except Exception as e:
                  print('lookup failed', word, e)
                  return ''
              candidates = []
              for entry in data if isinstance(data, list) else []:
                  for p in entry.get('phonetics', []) or []:
                      audio = (p.get('audio') or '').strip()
                      if not audio:
                          continue
                      if audio.startswith('//'):
                          audio = 'https:' + audio
                      if not audio.startswith('https://'):
                          continue
                      low = audio.lower()
                      score = (100 if re.search(r'(^|[_./-])us([_./-]|$)', low) or '_us_' in low or '-us-' in low else 0) + (2 if low.endswith('.mp3') else 0)
                      candidates.append((score, audio))
              return max(candidates)[1] if candidates else ''

          audio = {}
          for i, word in enumerate(words, 1):
              src = lookup(word)
              if src:
                  audio[word] = src
              print(f'{i}/{len(words)} {word}: {src or "no audio"}')
              time.sleep(0.08)

          payload = json.dumps(audio, ensure_ascii=False, separators=(',', ':'))
          replacement = 'window.KAOYAN_AUDIO=' + payload + ';'
          if re.search(r'window\.KAOYAN_AUDIO=\{.*?\};', text, re.S):
              text = re.sub(r'window\.KAOYAN_AUDIO=\{.*?\};', replacement, text, count=1, flags=re.S)
          else:
              text = text.replace('</script><script src="../app.js"></script>', replacement + '</script><script src="../app.js"></script>', 1)
          page.write_text(text, encoding='utf-8')
          print(f'Cached {len(audio)}/{len(words)} pronunciation URLs in {page}')

      - name: Commit generated caches
        run: |
          if git diff --quiet -- days data/vocab-log.json; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add days/*.html data/vocab-log.json
          git commit -m 'Sync daily vocab and pronunciation URLs'
          git push
