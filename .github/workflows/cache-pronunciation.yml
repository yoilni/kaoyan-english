name: Cache pronunciation URLs

on:
  push:
    branches: [main]
    paths:
      - 'days/*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve dictionary audio URLs
        shell: python
        run: |
          import json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          files = sorted(Path('days').glob('*.html'))
          if not files:
              raise SystemExit('No daily pages found')
          page = files[-1]
          text = page.read_text(encoding='utf-8')

          def read_obj(name):
              m = re.search(rf'window\.{name}=({{.*?}});', text, re.S)
              return json.loads(m.group(1)) if m else {}

          words = []
          for src in (read_obj('KAOYAN_NEW'), read_obj('KAOYAN_REVIEW')):
              for word in src:
                  key = word.lower()
                  if key not in words:
                      words.append(key)

          def lookup(word):
              url = 'https://api.dictionaryapi.dev/api/v2/entries/en/' + urllib.parse.quote(word)
              req = urllib.request.Request(url, headers={'User-Agent':'kaoyan-english-pronunciation-cache/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      data = json.load(r)
              except Exception as e:
                  print('lookup failed', word, e)
                  return ''
              candidates = []
              for entry in data if isinstance(data, list) else []:
                  for p in entry.get('phonetics', []) or []:
                      audio = (p.get('audio') or '').strip()
                      if not audio:
                          continue
                      if audio.startswith('//'):
                          audio = 'https:' + audio
                      if not audio.startswith('https://'):
                          continue
                      score = 0
                      low = audio.lower()
                      if re.search(r'(^|[_./-])us([_./-]|$)', low) or '_us_' in low or '-us-' in low:
                          score += 100
                      if 'us' in (p.get('text') or '').lower():
                          score += 5
                      if low.endswith('.mp3'):
                          score += 2
                      candidates.append((score, audio))
              if not candidates:
                  return ''
              candidates.sort(reverse=True)
              return candidates[0][1]

          audio = {}
          for i, word in enumerate(words, 1):
              src = lookup(word)
              if src:
                  audio[word] = src
                  print(f'{i}/{len(words)} {word}: {src}')
              else:
                  print(f'{i}/{len(words)} {word}: no audio')
              time.sleep(0.08)

          payload = json.dumps(audio, ensure_ascii=False, separators=(',', ':'))
          replacement = 'window.KAOYAN_AUDIO=' + payload + ';'
          if re.search(r'window\.KAOYAN_AUDIO=\{.*?\};', text, re.S):
              text = re.sub(r'window\.KAOYAN_AUDIO=\{.*?\};', replacement, text, count=1, flags=re.S)
          else:
              text = text.replace('</script><script src="../app.js"></script>', replacement + '</script><script src="../app.js"></script>', 1)
          page.write_text(text, encoding='utf-8')
          print(f'Cached {len(audio)}/{len(words)} pronunciation URLs in {page}')

      - name: Commit cached audio
        run: |
          if git diff --quiet -- days; then
            echo 'No pronunciation changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add days/*.html
          git commit -m 'Cache dictionary pronunciation URLs'
          git push
